# Day 8+ — app.<domain> → React admin dist (Sahil)
# Day 7 IP testing for admin: see deploy/nginx/admin.conf (monorepo) /
# or temporarily enable that site instead of ip-web.conf.

server {
    listen 80;
    listen [::]:80;
    server_name app.yourdomain.com;

    root /var/www/admin;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
