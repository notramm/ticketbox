# Day 8+ — app.__DOMAIN__ → React admin dist (Sahil)

server {
    listen 80;
    listen [::]:80;
    server_name app.__DOMAIN__;

    root /var/www/admin;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
