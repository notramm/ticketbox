# Day 7 — public EJS site on the EC2 public IP (Ram PRD checkpoint).
#
#   http://YOUR_EC2_PUBLIC_IP  →  PM2 web (127.0.0.1:3000)
#
# Do NOT open 3000 publicly. Only nginx :80.
#
# Enable:
#   sudo cp infra/nginx/ip-web.conf /etc/nginx/sites-available/ticketbox-web
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo ln -sf /etc/nginx/sites-available/ticketbox-web /etc/nginx/sites-enabled/ticketbox-web
#   # If Sahil's admin site is also enabled, disable it for this checkpoint or
#   # it will steal default_server on :80.
#   sudo rm -f /etc/nginx/sites-enabled/ticketbox-admin
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
